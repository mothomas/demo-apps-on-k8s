# ACM pull model: one Application per cluster selected by placement-bookstore,
# created on the managed cluster and synced by that cluster's own Argo CD.
#
# Helm values: values.yaml + values-<cluster-name>.yaml from helm/bookstore/.
# Each target cluster needs its own values-<cluster-name>.yaml (NLB subnets/IPs,
# MetalLB IP, storageClass, DB secret, ...); copy values-eks/-rosa/-ocp-metallb.yaml
# as a starting point. A missing file fails the sync instead of deploying defaults.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: bookstore-pull-model
  namespace: openshift-gitops
spec:
  generators:
    - matrix:
        generators:
          - list:
              elements:
                - appName: bookstore
                  namespace: app1
                  chartPath: helm/bookstore
          - clusterDecisionResource:
              configMapRef: acm-placement
              labelSelector:
                matchLabels:
                  cluster.open-cluster-management.io/placement: placement-bookstore
              requeueAfterSeconds: 180
  template:
    metadata:
      annotations:
        apps.open-cluster-management.io/ocm-managed-cluster: '{{name}}'
        apps.open-cluster-management.io/ocm-managed-cluster-app-namespace: openshift-gitops
        argocd.argoproj.io/skip-reconcile: 'true'
      labels:
        apps.open-cluster-management.io/pull-to-ocm-managed-cluster: 'true'
      name: '{{appName}}-{{name}}'
    spec:
      destination:
        namespace: '{{namespace}}'
        server: 'https://kubernetes.default.svc'
      project: default
      source:
        repoURL: 'https://github.com/mothomas/demo-apps-on-k8s.git'
        targetRevision: master
        path: '{{chartPath}}'
        helm:
          releaseName: '{{appName}}'
          valueFiles:
            - values.yaml
            - 'values-{{name}}.yaml'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        managedNamespaceMetadata:
          labels:
            argocd.argoproj.io/managed-by: openshift-gitops
        retry:
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
          limit: 5
        syncOptions:
          - CreateNamespace=true
