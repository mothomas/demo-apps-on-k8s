# =============================================================================
# BookStore Helm chart - default values (vanilla Kubernetes).
# Platform overlays live next to this file:
#   values-eks.yaml          -> Amazon EKS (AWS Load Balancer Controller, NLB)
#   values-rosa.yaml         -> Red Hat OpenShift Service on AWS (NLB)
#   values-ocp-metallb.yaml  -> On-prem OpenShift with MetalLB
# =============================================================================

nameOverride: ""
fullnameOverride: ""

# Cluster DNS domain, used to build upstream FQDNs in the NGINX config.
clusterDomain: cluster.local

global:
  # Prefix applied to every image repository (e.g. a private mirror / Artifactory).
  imageRegistry: ""
  imagePullSecrets: []
  # - name: my-pull-secret

# Extra labels added to every resource.
commonLabels: {}

# -----------------------------------------------------------------------------
# OpenShift (ROSA / OCP) behaviour
# -----------------------------------------------------------------------------
openshift:
  # When true, fixed runAsUser/runAsGroup/fsGroup are stripped from pod security
  # contexts so the restricted-v2 SCC can assign UIDs from the namespace range.
  enabled: false
  # The upstream demo images (website, shopui, shopapi) run as root on port 80.
  # When true, their ServiceAccount is bound to the "anyuid" SCC. Set to false
  # once you rebuild those images to run as non-root.
  legacyAppsAnyuid: true

# -----------------------------------------------------------------------------
# Service accounts
#   <fullname>         -> NGINX proxy + MySQL (restricted)
#   <fullname>-legacy  -> website / shopui / shopapi (anyuid on OpenShift)
# -----------------------------------------------------------------------------
serviceAccount:
  create: true
  annotations: {}
  # Override generated names (only used when create=false or to pin a name).
  name: ""
  legacyName: ""

# -----------------------------------------------------------------------------
# Common pod defaults (merged into each component unless overridden)
# -----------------------------------------------------------------------------
defaults:
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  podAnnotations: {}
  podLabels: {}

# =============================================================================
# NGINX reverse proxy (replaces Ingress controller / OpenShift Route)
# Exposed through a LoadBalancer Service; routing lives in a ConfigMap.
# =============================================================================
proxy:
  enabled: true
  # Resource name for Deployment/Service/ConfigMap. Also used for the `app` label.
  fullnameOverride: stateless-app
  replicaCount: 2

  image:
    repository: nginxinc/nginx-unprivileged
    tag: "1.27-alpine"
    pullPolicy: IfNotPresent

  # Port NGINX listens on inside the pod (unprivileged -> must be >1024).
  containerPort: 8080

  # Path routing (the old route/ingress.yaml). NGINX picks the longest matching
  # prefix, so order does not matter.
  #   component: website | shopui | shopapi  (resolved to the in-chart Service)
  #   upstream:  "host:port"                 (any other backend, instead of component)
  routes:
    - path: /api
      component: shopapi
    - path: /shop
      component: shopui
    - path: /
      component: website

  # Tunables rendered into nginx.conf
  config:
    workerConnections: 1024
    clientMaxBodySize: 10m
    keepaliveTimeout: 65
    proxyConnectTimeout: 5s
    proxyReadTimeout: 60s
    proxySendTimeout: 60s
    upstreamKeepalive: 16
    # Trust X-Forwarded-* from these CIDRs (e.g. the NLB / MetalLB ranges).
    realIpFrom: []
    # Raw NGINX directives injected into the http {} block.
    httpSnippet: ""
    # Raw NGINX directives injected into the server {} block.
    serverSnippet: ""

  # Provide a complete nginx.conf to bypass the generated one entirely.
  customConfig: ""

  service:
    type: LoadBalancer
    # External port on the load balancer. targetPort is always proxy.containerPort.
    port: 8080
    portName: http
    annotations: {}
    labels: {}
    loadBalancerClass: ""
    loadBalancerIP: ""
    loadBalancerSourceRanges: []
    externalTrafficPolicy: ""
    # null = omit the field (cluster default)
    allocateLoadBalancerNodePorts: null

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
    fsGroup: 101
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

  livenessProbe:
    httpGet:
      path: /healthz
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10
  readinessProbe:
    httpGet:
      path: /healthz
      port: http
    initialDelaySeconds: 2
    periodSeconds: 5

  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  podAnnotations: {}
  podLabels: {}

# =============================================================================
# website - static landing site
# =============================================================================
website:
  enabled: true
  replicaCount: 2
  image:
    repository: devteds/demo-bookstore-website
    tag: "1.0"
    pullPolicy: IfNotPresent
  containerPort: 80
  service:
    port: 80
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      memory: 128Mi
  podSecurityContext: {}
  securityContext:
    allowPrivilegeEscalation: false
  livenessProbe:
    tcpSocket:
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10
  readinessProbe:
    tcpSocket:
      port: http
    periodSeconds: 5
  extraEnv: []
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  podAnnotations: {}
  podLabels: {}

# =============================================================================
# shopui - shopping SPA (served under /shop)
# =============================================================================
shopui:
  enabled: true
  replicaCount: 2
  image:
    repository: devteds/demo-bookstore-shopui
    tag: "1.0"
    pullPolicy: IfNotPresent
  containerPort: 80
  service:
    port: 80
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      memory: 128Mi
  podSecurityContext: {}
  securityContext:
    allowPrivilegeEscalation: false
  livenessProbe:
    tcpSocket:
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10
  readinessProbe:
    tcpSocket:
      port: http
    periodSeconds: 5
  extraEnv: []
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  podAnnotations: {}
  podLabels: {}

# =============================================================================
# shopapi - Rails API (/api/books)
# =============================================================================
shopapi:
  enabled: true
  replicaCount: 1
  image:
    repository: devteds/demo-bookstore-shopapi
    tag: "1.0"
    pullPolicy: IfNotPresent
  containerPort: 3000
  service:
    port: 3000

  # Non-secret settings -> ConfigMap (was services/shopapi/config.yaml)
  config:
    RAILS_ENV: production
    RAILS_LOG_TO_STDOUT: "1"
  # DB_HOST / DB_NAME / DB_USER are injected automatically from `database`/`externalDatabase`.

  # DB_PASSWORD is mounted as a file here (as in the original manifests) AND set as env.
  secretMountPath: /app/config/app_secret

  # Block pod start until the database answers.
  waitForDatabase: true

  # Schema migration (was services/shopapi/job-dbc.yaml) - runs as a Helm hook
  # after every install/upgrade.
  migration:
    enabled: true
    command: ["bundle", "exec", "rails", "db:migrate"]
    backoffLimit: 4
    activeDeadlineSeconds: 600
    ttlSecondsAfterFinished: 600

  # Seed demo data (rails db:seed) - runs once, after the first install only.
  seed:
    enabled: false
    command: ["bundle", "exec", "rails", "db:seed"]
    backoffLimit: 2

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  podSecurityContext: {}
  securityContext:
    allowPrivilegeEscalation: false
  livenessProbe:
    tcpSocket:
      port: http
    initialDelaySeconds: 20
    periodSeconds: 15
  readinessProbe:
    tcpSocket:
      port: http
    initialDelaySeconds: 5
    periodSeconds: 5
  extraEnv: []
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  podAnnotations: {}
  podLabels: {}

# =============================================================================
# database - in-cluster MySQL StatefulSet (replaces `helm install stable/mysql`)
# Set enabled=false to use externalDatabase (e.g. RDS) instead.
# =============================================================================
database:
  enabled: true
  image:
    repository: mysql
    tag: "5.7"
    pullPolicy: IfNotPresent

  auth:
    database: bookstore
    username: appuser
    # Leave empty to auto-generate (kept stable across `helm upgrade` via lookup).
    # For GitOps (Argo CD / Flux) set these or use existingSecret - lookup is not
    # available there and a regenerated password will NOT match the initialised DB.
    password: ""
    rootPassword: ""
    # Use a pre-created Secret instead (e.g. from External Secrets / Vault).
    existingSecret: ""
    secretKeys:
      rootPassword: mysql-root-password
      userPassword: mysql-password

  # Rendered into /etc/mysql/conf.d/bookstore.cnf
  config: |
    [mysqld]
    character-set-server=utf8mb4
    collation-server=utf8mb4_unicode_ci
    skip-name-resolve
    max_connections=200
    innodb_buffer_pool_size=256M
    explicit_defaults_for_timestamp=1
    [client]
    default-character-set=utf8mb4

  service:
    port: 3306

  persistence:
    enabled: true
    # "" = cluster default StorageClass
    storageClass: ""
    accessModes: ["ReadWriteOnce"]
    size: 8Gi
    annotations: {}

  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 999
    fsGroup: 999
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]

  livenessProbe:
    exec:
      command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$MYSQL_ROOT_PASSWORD\" --silent"]
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
  readinessProbe:
    exec:
      command: ["sh", "-c", "mysql -h 127.0.0.1 -uroot -p\"$MYSQL_ROOT_PASSWORD\" -e 'SELECT 1'"]
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3

  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  podLabels: {}

# Used only when database.enabled=false
externalDatabase:
  host: ""
  port: 3306
  database: bookstore
  username: appuser
  password: ""
  # Existing Secret holding the password, and its key.
  existingSecret: ""
  existingSecretPasswordKey: mysql-password

# =============================================================================
# NetworkPolicies: LB -> proxy -> apps -> database (opt-in)
# =============================================================================
networkPolicy:
  enabled: false
  # Restrict who may reach the proxy. Empty = allow from anywhere (LB traffic).
  proxyIngressFrom: []
  # - ipBlock:
  #     cidr: 10.0.0.0/8
