{{- if .Values.networkPolicy.enabled }}
{{- $proxySel := include "bookstore.selectorLabels" (dict "root" . "component" "proxy") }}
{{- if .Values.proxy.enabled }}
# LB -> proxy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "bookstore.fullname" . }}-proxy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bookstore.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- $proxySel | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        - port: {{ .Values.proxy.containerPort }}
          protocol: TCP
      {{- with .Values.networkPolicy.proxyIngressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- range $component := list "website" "shopui" "shopapi" }}
{{- $c := index $.Values $component }}
{{- if $c.enabled }}
---
# proxy -> {{ $component }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "bookstore.componentName" (dict "root" $ "component" $component) }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "bookstore.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "bookstore.selectorLabels" (dict "root" $ "component" $component) | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- $proxySel | nindent 14 }}
      ports:
        - port: {{ $c.containerPort }}
          protocol: TCP
{{- end }}
{{- end }}
{{- if .Values.database.enabled }}
---
# shopapi + migration jobs -> mysql
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "bookstore.componentName" (dict "root" . "component" "database") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bookstore.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "bookstore.selectorLabels" (dict "root" . "component" "database") | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              bookstore.io/db-client: "true"
      ports:
        - port: 3306
          protocol: TCP
{{- end }}
{{- end }}
