{{- /*
DB credentials. Replaces services/shopapi/secret.yaml (which also had a stray
trailing newline in the base64 value).
Passwords: explicit value > value already in the cluster (lookup) > random.
*/ -}}
{{- if include "bookstore.db.createSecret" . }}
{{- $name := include "bookstore.db.secretName" . }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name) }}
{{- $data := dict }}
{{- if $existing }}{{ $data = $existing.data }}{{ end }}
{{- $rootKey := .Values.database.auth.secretKeys.rootPassword }}
{{- $userKey := .Values.database.auth.secretKeys.userPassword }}
{{- $userPw := "" }}
{{- $rootPw := "" }}
{{- if .Values.database.enabled }}
{{- $userPw = .Values.database.auth.password | default (get $data $userKey | default "" | b64dec) | default (randAlphaNum 24) }}
{{- $rootPw = .Values.database.auth.rootPassword | default (get $data $rootKey | default "" | b64dec) | default (randAlphaNum 24) }}
{{- else }}
{{- $userPw = required "externalDatabase.password (or externalDatabase.existingSecret) is required when database.enabled=false" .Values.externalDatabase.password }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bookstore.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
  annotations:
    # Never delete on uninstall - the PVC was initialised with these credentials.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{ $userKey }}: {{ $userPw | b64enc | quote }}
  {{- if .Values.database.enabled }}
  {{ $rootKey }}: {{ $rootPw | b64enc | quote }}
  {{- end }}
{{- end }}
