{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "bookstore.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bookstore.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "bookstore.legacyServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bookstore.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
{{- if and .Values.openshift.enabled .Values.openshift.legacyAppsAnyuid }}
---
# OpenShift: allow the legacy demo images (root, port 80) to run under anyuid.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "bookstore.fullname" . }}-legacy-anyuid
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bookstore.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:anyuid
subjects:
  - kind: ServiceAccount
    name: {{ include "bookstore.legacyServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
