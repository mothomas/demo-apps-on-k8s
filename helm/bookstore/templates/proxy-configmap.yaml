{{- if .Values.proxy.enabled }}
{{- $p := .Values.proxy }}
{{- $ctx := dict "root" . "component" "proxy" }}
# NGINX routing config - replaces route/ingress.yaml (Ingress / Route objects).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "bookstore.componentName" $ctx }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bookstore.componentLabels" $ctx | nindent 4 }}
data:
  nginx.conf: |
{{- if $p.customConfig }}
{{ $p.customConfig | indent 4 }}
{{- else }}
    worker_processes auto;
    pid /tmp/nginx.pid;
    error_log /dev/stderr warn;

    events {
      worker_connections {{ $p.config.workerConnections }};
    }

    http {
      include       /etc/nginx/mime.types;
      default_type  application/octet-stream;

      # Writable paths for a read-only root filesystem / arbitrary UID (OpenShift)
      client_body_temp_path /tmp/client_temp;
      proxy_temp_path       /tmp/proxy_temp;
      fastcgi_temp_path     /tmp/fastcgi_temp;
      uwsgi_temp_path       /tmp/uwsgi_temp;
      scgi_temp_path        /tmp/scgi_temp;

      log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                      'upstream=$upstream_addr rt=$request_time urt=$upstream_response_time';
      access_log /dev/stdout main;

      sendfile           on;
      tcp_nopush         on;
      server_tokens      off;
      keepalive_timeout  {{ $p.config.keepaliveTimeout }};
      client_max_body_size {{ $p.config.clientMaxBodySize }};

      {{- range $p.config.realIpFrom }}
      set_real_ip_from {{ . }};
      {{- end }}
      {{- if $p.config.realIpFrom }}
      real_ip_header X-Forwarded-For;
      real_ip_recursive on;
      {{- end }}

      map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
      }

      {{- range $i, $r := $p.routes }}

      upstream route_{{ $i }} {
        server {{ include "bookstore.proxy.upstream" (dict "root" $ "route" $r) }};
        keepalive {{ $p.config.upstreamKeepalive }};
      }
      {{- end }}

      {{- with $p.config.httpSnippet }}
      {{- . | nindent 6 }}
      {{- end }}

      server {
        listen {{ $p.containerPort }};
        server_name _;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_connect_timeout {{ $p.config.proxyConnectTimeout }};
        proxy_read_timeout    {{ $p.config.proxyReadTimeout }};
        proxy_send_timeout    {{ $p.config.proxySendTimeout }};

        location = /healthz {
          access_log off;
          default_type text/plain;
          return 200 "ok\n";
        }

        {{- range $i, $r := $p.routes }}

        location {{ $r.path }} {
          proxy_pass http://route_{{ $i }};
        }
        {{- end }}

        {{- with $p.config.serverSnippet }}
        {{- . | nindent 8 }}
        {{- end }}
      }
    }
{{- end }}
{{- end }}
